get_sleep_reports:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: sleepme_thermostat
    start_date:
      required: false
      selector:
        date:
    days_back:
      required: false
      default: 6
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    time_zone:
      required: false
      selector:
        text:
